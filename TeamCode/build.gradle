buildscript {
    repositories {
        mavenCentral()
        google()
        maven { url "https://repo.dairy.foundation/releases" }
    }
    dependencies {
        classpath "dev.frozenmilk:Load:0.3.2"
    }
}

apply plugin: 'com.android.application'
apply plugin: 'dev.frozenmilk.sinister.sloth.load'

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs {
            pickFirsts += ['**/*.so']
        }
        jniLibs.useLegacyPackaging true
    }
}

repositories {
    maven { url = 'https://maven.brott.dev/' }
    maven { url = "https://repo.dairy.foundation/releases" }
    maven { url = "https://mymaven.bylazar.com/releases" }
}

dependencies {
    implementation('com.pedropathing:ftc:2.1.2')
    implementation('com.pedropathing:telemetry:1.0.0')

    implementation("dev.frozenmilk.sinister:Sloth:0.3.2")
    implementation('com.bylazar:fullpanels:1.0.20')

    implementation("org.solverslib:core:0.3.6")
    implementation("org.solverslib:pedroPathing:0.3.6")
}
